# Test configuration for integration tests
spring.application.name=templates

# Database configuration - use H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging configuration for tests
logging.level.io.tenoro=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.test=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Disable actuator endpoints in tests
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true

# Test profile specific settings
# Note: spring.profiles.active is set via @ActiveProfiles annotation in test classes

# Mock Google Maps API key for tests
google.maps.api.key=test-api-key
