# Import base application.properties
spring.config.import=application.properties

# Local Development Profile Configuration

# Local development logging configuration
logging.level.root=INFO
logging.level.io.tenoro=DEBUG

# Development-specific actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics,env,beans,configprops,loggers,threaddump,heapdump
management.endpoint.health.show-details=always
